<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Happy Birthday Sujita</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        h1 {
            color: #ff4d6d;
            font-size: 40px;
            margin-bottom: 10px;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            color: #555;
        }
        .cake {
            font-size: 60px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎉 Happy Birthday 🎉</h1>
        <h2>Sujita 💖</h2>
        <div class="cake">🎂</div>
        <p>
            May your day be filled with happiness,<br>
            laughter, and beautiful memories.<br>
            Wishing you success and joy always!
        </p>
    </div>
</body>
</html>
