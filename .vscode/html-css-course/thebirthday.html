<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday 
     🎂</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle, #ff9a9e, #fad0c4);
        font-family: 'Segoe UI', sans-serif;
    }

    .card {
        background: rgba(255, 255, 255, 0.95);
        padding: 45px;
        border-radius: 25px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        animation: zoom 1.5s ease;
        z-index: 2;
    }

    h1 {
        font-size: 45px;
        color: #ff1493;
        text-shadow: 0 0 10px #ff69b4;
    }

    .name {
        font-size: 36px;
        color: #ff5722;
        margin: 10px 0;
        text-shadow: 0 0 8px #ffa07a;
    }

    p {
        font-size: 18px;
        color: #444;
        line-height: 1.6;
    }

    .heart {
        font-size: 30px;
        animation: beat 1s infinite;
        color: red;
    }

    @keyframes zoom {
        from { transform: scale(0); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    @keyframes beat {
        0%,100% { transform: scale(1); }
        50% { transform: scale(1.3); }
    }

    /* Confetti */
    .confetti {
        position: absolute;
        width: 10px;
        height: 10px;
        animation: fall 5s linear infinite;
        opacity: 0.8;
    }

    @keyframes fall {
        0% { transform: translateY(-100vh) rotate(0deg); }
        100% { transform: translateY(100vh) rotate(360deg); }
    }
</style>
</head>

<body>

<!-- Background Music -->
<audio autoplay loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div class="card">
    <h1>🎉 Happy Birthday 🎉</h1>
    <div class="name">Sobha</div>
    <p>
        May your life shine bright like stars ✨<br>
        May your dreams come true 🌈<br>
        Wishing you happiness, love & success 🎂
    </p>
    <div class="heart">❤️</div>
</div>

<script>
    // Confetti Generator
    for (let i = 0; i < 60; i++) {
        let confetti = document.createElement("div");
        confetti.className = "confetti";
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.backgroundColor =
            `hsl(${Math.random() * 360}, 100%, 50%)`;
        confetti.style.animationDuration = (Math.random() * 3 + 2) + "s";
        confetti.style.width = confetti.style.height =
            (Math.random() * 8 + 6) + "px";
        document.body.appendChild(confetti);
    }
</script>

</body>
</html>
