!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Buttons UI</title>

<style>
    body {
        font-family: Arial, sans-serif;
        padding: 40px;
    }

    .btn {
        padding: 10px 22px;
        margin-right: 15px;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: 0.2s;
    }

    /* SUBSCRIBE button (red) */
    .subscribe {
        background: #d50000;
        color: white;
    }
    .subscribe:hover {
        background: #b30000;
    }

    /* JOIN button (white outline) */
    .join {
        background: white;
        color: #0064d2;
        border: 2px solid #0064d2;
    }
    .join:hover {
        background: #e8f2ff;
    }

    /* Tweet button (blue + shadow) */
    .tweet {
        background: #007bff;
        color: white;
        border-radius: 30px;
        box-shadow: 10px 10px 20px rgba(0,0,0,0.5);
    }
    .tweet:hover {
        background: #0066d4;
    }
</style>
</head>

<body>

    <button class="btn subscribe">SUBSCRIBE</button>
    <button class="btn join">JOIN</button>
    <button class="btn tweet">Tweet</button>

</body>
</html>
