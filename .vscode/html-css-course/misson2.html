<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hostel Snack Shop — Maggi, Kurkure, Cold Drink</title>
  <style>
    :root{ --accent:#ff6f61; --bg:#f7f7f8; --card:#ffffff; --muted:#666 }
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans',arial; margin:0;background:var(--bg); color:#222}
    header{background:linear-gradient(90deg,var(--accent),#ff9a76); color:white;padding:18px 16px}
    .container{max-width:900px;margin:18px auto;padding:12px}
    h1{margin:0;font-size:20px}
    .hero{display:flex;gap:12px;align-items:center}
    .card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 6px 20px rgba(10,10,10,0.06)}
    .menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
    .menu-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:8px;border:1px solid #eee}
    .menu-item .info{max-width:70%}
    label{display:block;font-size:14px;margin-bottom:6px}
    input[type="number"], input[type="text"], input[type="tel"] , select{width:100%;padding:8px;border-radius:6px;border:1px solid #ddd}
    .row{display:flex;gap:12px}
    .row .col{flex:1}
    .summary{margin-top:12px}
    .btn{display:inline-block;padding:10px 14px;border-radius:8px;border:0;cursor:pointer}
    .btn-primary{background:var(--accent);color:white}
    .btn-muted{background:#eee}
    footer{margin-top:18px;text-align:center;color:var(--muted);font-size:13px}
    @media(max-width:640px){.menu{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start}}
  </style>
