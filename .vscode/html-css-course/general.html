<!DOCTYPE html>
<html>
<head>
<title>Smart Billing System</title>

<style>
body {
    font-family: 'Segoe UI';
    margin: 0;
    background: #f4f6f8;
    transition: 0.3s;
}

.dark {
    background: #121212;
    color: white;
}

h1 {
    background: #2e7d32;
    color: white;
    padding: 15px;
    margin: 0;
    text-align: center;
}

.top-bar {
    display: flex;
    justify-content: space-around;
    padding: 10px;
    flex-wrap: wrap;
}

input, select {
    padding: 8px;
    margin: 5px;
}

.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-around;
}

.box {
    width: 45%;
    background: white;
    margin: 10px;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 5px 10px rgba(0,0,0,0.1);
}

.dark .box {
    background: #1e1e1e;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #2e7d32;
    color: white;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
}

tr:hover {
    background: #eee;
}

.dark tr:hover {
    background: #333;
}

button {
    padding: 8px 12px;
    margin: 5px;
    border: none;
    cursor: pointer;
    border-radius: 5px;
}

.green { background: #2e7d32; color: white; }
.red { background: #c62828; color: white; }

@media(max-width:768px){
    .box { width: 90%; }
}
</style>
</head>

<body>

<h1>🛒 Smart Billing System</h1>

<div class="top-bar">
    <input type="text" id="search" placeholder="Search item..." onkeyup="filterItems()">
    
    <select id="category" onchange="filterItems()">
        <option value="all">All Categories</option>
        <option value="food">Food</option>
        <option value="daily">Daily Use</option>
        <option value="stationary">Stationary</option>
    </select>

    <button onclick="toggleDark()">🌙 Dark Mode</button>
</div>

<div class="container">

<div class="box">
<h3>Items</h3>
<table id="table">
<tr><th>Item</th><th>Price</th><th>Qty</th><th>Action</th></tr>
</table>

<button class="green" onclick="updateBill()">Show Bill</button>
<button class="red" onclick="clearAll()">Clear</button>
<button class="green" onclick="print()">Print</button>
</div>

<div class="box">
<h3>Bill</h3>
<div id="bill"></div>
<h3 id="total"></h3>
</div>

</div>

<script>
const items = [
    {name:"milk", price:23, cat:"food"},
    {name:"maggi", price:40, cat:"food"},
    {name:"kurkure", price:10, cat:"food"},
    {name:"bread", price:25, cat:"food"},
    {name:"butter", price:55, cat:"food"},
    {name:"toothpaste", price:45, cat:"daily"},
    {name:"soap", price:35, cat:"daily"},
    {name:"shampoo", price:120, cat:"daily"},
    {name:"pen", price:10, cat:"stationary"},
    {name:"notebook", price:50, cat:"stationary"}
];

const table = document.getElementById("table");

function loadItems(list){
    table.innerHTML = "<tr><th>Item</th><th>Price</th><th>Qty</th><th>Action</th></tr>";

    list.forEach(item=>{
        let row = table.insertRow();
        row.insertCell(0).innerText = item.name;
        row.insertCell(1).innerText = item.price;
        row.insertCell(2).innerHTML = `<input type="number" value="0" min="0" onchange="updateBill()">`;
        row.insertCell(3).innerHTML = `<button onclick="removeItem(this)">❌</button>`;
    });
}

loadItems(items);

function filterItems(){
    let search = document.getElementById("search").value.toLowerCase();
    let cat = document.getElementById("category").value;

    let filtered = items.filter(i=>{
        return (i.name.includes(search)) &&
               (cat==="all" || i.cat===cat);
    });

    loadItems(filtered);
}

function removeItem(btn){
    btn.parentNode.parentNode.cells[2].children[0].value = 0;
    updateBill();
}

function clearAll(){
    document.querySelectorAll("input").forEach(i=>i.value=0);
    updateBill();
}

function updateBill(){
    let rows = table.rows;
    let total = 0;
    let output = "";

    for(let i=1;i<rows.length;i++){
        let name = rows[i].cells[0].innerText;
        let price = rows[i].cells[1].innerText;
        let qty = rows[i].cells[2].children[0].value;

        if(qty>0){
            let cost = price*qty;
            total += cost;
            output += `${name} → ₹${price} × ${qty} = ₹${cost}<br>`;
        }
    }

    document.getElementById("bill").innerHTML = output || "No items selected";
    document.getElementById("total").innerText = "Total: ₹ " + total;
}

function toggleDark(){
    document.body.classList.toggle("dark");
}
</script>

</body>
</html>
